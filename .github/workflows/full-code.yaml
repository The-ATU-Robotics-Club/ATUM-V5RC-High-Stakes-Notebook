name: Full Code

on: workflow_dispatch

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Notebook Repository
        uses: actions/checkout@v3

      - name: Clone Code Repository
        uses: actions/checkout@v3
        with:
          repository: The-ATU-Robotics-Club/ATUM-V5RC-High-Stakes-Code
          ssh-key: ${{ secrets.SSH_CODE_REPO_PRIVATE_KEY }}
          path: ./tmp

      - name: Get and Place Code Files
        run: |
          rm -rf tmp/include/atum/depend
          rm -rf tmp/src/atum/depend
          rm -rf software/code/files/api/include/*
          rm -rf software/code/files/api/src/*
          rm -rf software/code/files/impl/include/*
          rm -rf software/code/files/impl/src/*
          cp -r tmp/include/atum/* software/code/files/api/include
          cp -r tmp/src/atum/* software/code/files/api/src
          cp -r tmp/include/robots/* software/code/files/impl/include
          cp -r tmp/src/robots/* software/code/files/impl/src
          rm -rf tmp

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
  
      - name: Convert Code to LaTeX
        run: python3 .github/code-to-latex.py
  

      - name: Commit Changes
        run: |
          git config --local user.email "atumsfamily8@gmail.com"
          git config --local user.name "ATUBot"
          git add -A
          git commit -a -m "Update code."
        continue-on-error: true

      - name: Push Commit
        uses: ad-m/github-push-action@master
        with:
          branch: main
          github_token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
